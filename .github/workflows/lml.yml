name: LeanMachineLearning

# Builds the site of LeanMachineLearning's main every day: the library from its Mathlib cache and its
# own modules, its dataset by the extractor's action (the newest trust-extract release for its
# toolchain), published as the release lml-dataset-<commit12>, and the site with trust-site, against
# the previous build as baseline and with the provenance ledger this repository keeps
# (data/lml-ledger.json, recorded by evidence-core). The dataset follows dependencies into Mathlib and
# Lean core (--upstream-closure term), and the same data is also shown with trust's front end, our
# fork of trust-web, under trust/. The demos of demos.txt are built alongside, from their datasets.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['demos.txt', 'index.html', '.github/workflows/lml.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lml
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: LeanMachineLearning's main
        run: |
          git clone -q https://github.com/LeanMachineLearning/LML "$RUNNER_TEMP/lml"
          cd "$RUNNER_TEMP/lml"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
          echo "LABEL=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "TAG=lml-dataset-$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_ENV"
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the library
        working-directory: ${{ runner.temp }}/lml
        run: |
          lake exe cache get
          lake build LeanMachineLearning 2>&1 | tail -3
      - name: Extract and publish
        id: extract
        uses: LeanTrustBuilders/extractor/extract@main
        with:
          root: LeanMachineLearning
          repo: LeanMachineLearning/LML
          directory: ${{ runner.temp }}/lml
          args: --upstream-closure term
          publish: ${{ env.TAG }}
          title: LeanMachineLearning ${{ env.COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: trust-site, with evidence-core and evidence-store
        run: pip install -q git+https://github.com/LeanTrustBuilders/referee-site
      - name: Baseline and ledger
        env:
          DATASET: ${{ steps.extract.outputs.dataset }}
        run: |
          # The baseline is the previous build the ledger recorded, whose dataset is a release here.
          prev=$(evidence-core ledger --ledger data/lml-ledger.json --previous "$COMMIT")
          if [ -n "$prev" ] && evidence-store dataset --repo "$GITHUB_REPOSITORY" --tag 'lml-dataset-{commit12}' \
              --commit "$prev" --out "$RUNNER_TEMP/baseline" > /dev/null; then
            echo "BASELINE=--baseline $RUNNER_TEMP/baseline" >> "$GITHUB_ENV"
          fi
          evidence-core ledger --ledger data/lml-ledger.json --dataset "$DATASET" --date "$DATE" --label "$LABEL"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "LeanMachineLearning ${COMMIT:0:7}: record the build"
            for attempt in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - name: Build the site
        env:
          DATASET: ${{ steps.extract.outputs.dataset }}
        run: |
          mkdir -p _site
          trust-site build --dataset "$DATASET" --source "$RUNNER_TEMP/lml" $BASELINE \
            --ledger data/lml-ledger.json --trust mathlib --out _site/lml
          cp index.html _site/
      - name: The demos, from their datasets
        run: |
          grep -v '^#' demos.txt | while read -r name repo commit; do
            [ -n "$name" ] || continue
            d="$RUNNER_TEMP/demos/$name"
            evidence-store dataset --repo "$GITHUB_REPOSITORY" --tag "$name-dataset-{commit12}" --commit "$commit" \
              --out "$d/dataset" > /dev/null
            git init -q "$d/src" && git -C "$d/src" fetch -q --depth 1 "https://github.com/$repo" "$commit" \
              && git -C "$d/src" checkout -q FETCH_HEAD
            trust-site build --dataset "$d/dataset" --source "$d/src" --out "_site/$name"
            trust-site build --dataset "$d/dataset" --source "$d/src" --claims-only --out "_site/$name/claims"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: trust's front end, on the same dataset
        run: |
          git clone -q --depth 1 https://github.com/LeanTrustBuilders/trust-web "$RUNNER_TEMP/trust-web"
          (cd "$RUNNER_TEMP/trust-web" && npm ci --no-audit --no-fund &&
            VITE_TRUST_SERVER=none VITE_MARKS_API=none VITE_DEFAULT_INDEX=lml npm run build)
          mkdir -p _site/trust && cp -r "$RUNNER_TEMP/trust-web/dist/." _site/trust/
          # The first claim the site found, as the declaration shown first.
          start=$(python3 -c "import json; c = json.load(open('_site/lml/data/site.json')).get('claims') or {}; print(((c.get('claims') or [{}])[0]).get('decl', ''))")
          trust-site trust-index --dataset "${{ steps.extract.outputs.dataset }}" --out _site/trust/index --name lml \
            --trust mathlib --decl-url "../lml/#/d/{name}" ${start:+--start "$start"}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
